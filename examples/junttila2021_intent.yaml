    identifier: ERR_PLACEHOLDER_L3
    paired: true
    metadata: { sample_label: L3, species: "Cladonia arbuscula" }
  - kind: ena
    identifier: ERR_PLACEHOLDER_L4
    paired: true
    metadata: { sample_label: L4, species: "Cladonia uncialis" }
  - kind: ena
    identifier: ERR_PLACEHOLDER_L34
    paired: true
    metadata: { sample_label: L34, species: "Cladonia rangiferina" }
  - kind: ena
    identifier: ERR_PLACEHOLDER_L35
    paired: true
    metadata: { sample_label: L35, species: "Cladonia stellaris" }
